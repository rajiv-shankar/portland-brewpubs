<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login - Portland Brewpubs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .login-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            color: #2c5f2d;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus {
            border-color: #2c5f2d;
            outline: none;
            box-shadow: 0 0 5px rgba(44, 95, 45, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #2c5f2d;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #1e4620;
        }

        .error-message {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .success-message {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .nav-link {
            text-align: center;
            margin-top: 20px;
        }

        .nav-link a {
            color: #2c5f2d;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-link a:hover {
            text-decoration: underline;
        }

        .test-credentials {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>

    <style th:replace="~{fragments/nav :: navbar-styles}"></style>
</head>

<body>

<nav th:replace="~{fragments/nav :: navbar}"></nav>

<div class="login-container">

    <div class="header">
        <h1>🍺 Login</h1>
        <p>Access your Portland Brewpubs account</p>
    </div>

    <!-- Error message (shown when login fails) -->
    <div th:if="${errorMessage}" class="error-message">
        <span th:text="${errorMessage}">Error</span>
    </div>

    <!-- Success message (shown after logout) -->
    <div th:if="${logoutMessage}" class="success-message">
        <span th:text="${logoutMessage}">Logged out</span>
    </div>

    <!-- Test credentials box (remove in production!) -->
    <div class="test-credentials">
        <strong>Test Credentials:</strong><br>
        Username: <code>rajiv</code> | Password: <code>password123</code><br>
        Username: <code>admin</code> | Password: <code>admin123</code>
    </div>

    <!--
    IMPORTANT: Form action is "/login" with method POST
    Spring Security intercepts this automatically!
    We don't write a @PostMapping for /login - Spring handles it.

    Field names MUST be "username" and "password"
    (Spring Security expects these exact names)
    -->
    <form th:action="@{/login}" method="POST">

        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username"
                   placeholder="Enter your username" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password" required>
        </div>

        <button type="submit">Login</button>

    </form>

    <div class="nav-link">
        <p>Don't have an account? <a href="/register">Register here</a></p>
        <p><a href="/">← Back to Home</a></p>
    </div>

</div>

</body>
</html>
