<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<nav th:fragment="navbar" class="navbar">
    <div class="nav-brand">
        <a href="/">🍺 Portland Brewpubs</a>
    </div>
    <div class="nav-links">
        <a th:href="@{/}" th:classappend="${currentPage == 'home' ? 'active' : ''}">Home</a>
        <a th:href="@{/breweries}" th:classappend="${currentPage == 'breweries' ? 'active' : ''}">Breweries</a>

        <!-- Show Register and Login only when NOT logged in -->
        <span sec:authorize="!isAuthenticated()">
            <a th:href="@{/register}" th:classappend="${currentPage == 'register' ? 'active' : ''}">Register</a>
            <a th:href="@{/login}" th:classappend="${currentPage == 'login' ? 'active' : ''}">Login</a>
        </span>

        <!-- Show Logout only when logged in -->
        <span sec:authorize="isAuthenticated()">
            <span class="username">
                Welcome, <span sec:authentication="name">User</span>!
            </span>
            <form th:action="@{/logout}" method="POST" style="display: inline;">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </span>
    </div>
</nav>

<style th:fragment="navbar-styles">
    .navbar {
        background-color: #2c5f2d;
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .nav-brand a {
        color: white;
        text-decoration: none;
        font-size: 24px;
        font-weight: bold;
    }
    .nav-links a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
        padding: 8px 16px;
        border-radius: 4px;
        transition: background-color 0.3s;
    }
    .nav-links a:hover { background-color: rgba(255,255,255,0.2); }
    .nav-links a.active { background-color: rgba(255,255,255,0.3); }
    .username {
        color: #c8e6c9;
        margin-left: 20px;
        font-style: italic;
    }
    .logout-btn {
        background-color: #c62828;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        margin-left: 10px;
        font-size: 14px;
    }
    .logout-btn:hover {
        background-color: #b71c1c;
    }
</style>
</html>
